[project]
name = "smart_shopping_price_comparison_agent"
version = "0.1.0"
description = "A CrewAI crew for evidence-based product search, price comparison, and purchasing recommendations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai==1.15.5",
    "crewai-tools[exa-py]==1.15.5",
    "pydantic==2.12.5",
    "pymupdf==1.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
